<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SQL Apps</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <h1>SQL Apps</h1>
      <p>Azure SQL Database behind Data API builder, with Microsoft Entra roles.</p>
      <section aria-label="Account and application access">
        <p id="auth-notice" hidden></p>
        <button id="login" hidden>Sign in with Microsoft</button>
        <button id="logout" hidden>Sign out</button>
        <button id="auth-retry" hidden>Try again</button>
        <p id="auth-status" role="status" aria-live="polite">Loading account options...</p>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="workspace" hidden>
        <h2>Data</h2>
        <p>Calls the read-only readiness procedure through the gateway and Data API builder.</p>
        <button id="check-data">Check data</button>
        <pre id="data-result"></pre>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
